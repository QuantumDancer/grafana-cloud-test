name: lint

# Two independent, cheap static-analysis jobs — each path-filtered so it only
# runs when the thing it lints actually changed.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "charts/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "charts/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest runner images ship shellcheck preinstalled — no setup
      # action needed for a check this cheap.
      - run: shellcheck scripts/*.sh

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # charts/ doesn't exist yet at the time this workflow was written (the
      # Shop chart lands in a later issue) — the path filters above already
      # keep this workflow from triggering on unrelated changes, but this
      # guards the same job against running (and failing on a missing
      # directory) if it's ever invoked before charts/ exists, e.g. via a
      # manual re-run or a future workflow_dispatch trigger.
      - name: Check charts/ exists
        id: charts
        run: |
          if [ -d charts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping helm lint — charts/ does not exist yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Helm
        if: steps.charts.outputs.exists == 'true'
        uses: azure/setup-helm@v5

      - name: helm lint
        if: steps.charts.outputs.exists == 'true'
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            helm lint "$chart"
          done

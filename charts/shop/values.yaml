# Spyglass shop — default values.
#
# This chart is always installed into the `shop` namespace created by the
# 40-platform tofu component (`helm upgrade -i spyglass charts/shop -n shop`
# — see scripts/deploy-shop.sh); it deliberately never creates a Namespace
# resource itself, since the CNPG database and the k8s-monitoring Database
# Observability integration already depend on that namespace existing
# independently of whether the shop app happens to be installed.

# Per-component enable flags (issue 07): each top-level block's `enabled` key
# below renders nothing when false, so e.g. `--set loadgen.enabled=false` can
# pause synthetic traffic without tearing down the shop itself.

backend:
  enabled: true

  image:
    # REQUIRED: no public image exists at this placeholder path. The deploy
    # script always passes --backend-tag (and expects a real repository to
    # have been configured — see its --backend-repo flag) rather than
    # shipping a working default, since "ghcr.io/OWNER-PLACEHOLDER/..." is a
    # deliberately obvious sentinel that fails loudly (ImagePullBackOff)
    # instead of silently deploying nothing.
    repository: ghcr.io/OWNER-PLACEHOLDER/grafana-cloud-test/backend
    tag: latest
    # Always, not IfNotPresent: the deploy script defaults both tags to
    # `latest`, and a node that already holds an older `latest` would
    # otherwise silently keep serving it after CI pushes a new build.
    pullPolicy: Always

  service:
    port: 8080

  # Memory kept low enough that FAULT_MEMORY_LEAK's ~2 MiB/min default
  # growth rate fills the container's memory budget (and starts causing GC
  # pressure that the liveness probe below can detect) within a demo-able
  # timeframe rather than taking days. The CPU request reflects what the JVM
  # actually uses at boot — first live run under-requested at 100m, which let
  # everything schedule onto one 2-vCPU node and starve the whole stack
  # (requests are also what drives EKS Auto Mode scale-out).
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Boot protection: Spring Boot plus the OTel javaagent under the 500m CPU
  # limit above take well over a minute to start, far longer than the tight
  # liveness probe below tolerates. Kubernetes holds liveness/readiness off
  # until the startup probe succeeds, so this grants up to periodSeconds ×
  # failureThreshold = 300s of boot time without loosening the liveness
  # tuning that the memory-leak fault relies on.
  startupProbe:
    path: /api/health
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30

  # /api/health (HealthController) deliberately does zero DB work — see its
  # doc comment in the backend source — specifically so a Postgres blip
  # doesn't also fail the pod's liveness probe. That makes it the right
  # target for both probes here; Actuator's own /actuator/health (which does
  # check the DB) is left for manual/Kubernetes-Monitoring-style inspection
  # instead.
  #
  # Liveness is tuned to actually restart the pod once FAULT_MEMORY_LEAK
  # degrades it: as heap fills, GC pauses lengthen and eventually the JVM
  # can't service an HTTP request within timeoutSeconds, so a handful of
  # periodSeconds=10 failures on a short failureThreshold trips a restart —
  # producing the intended sawtooth memory graph in Kubernetes Monitoring.
  livenessProbe:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # Readiness is intentionally a little more patient than liveness — a
  # transient slow GC pause should pull the pod out of Service rotation
  # before it's bad enough to warrant a full restart.
  readinessProbe:
    path: /api/health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  otel:
    serviceName: spyglass-backend
    # Grafana's OTel Java distribution image (see the backend Dockerfile)
    # defaults to OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf against port
    # 4318 — this endpoint is left matching that protocol rather than
    # switching to the chart's gRPC (4317) alternative, so only the
    # *endpoint* needs overriding here, not the protocol too.
    endpoint: http://k8s-monitoring-alloy-metrics.monitoring.svc.cluster.local:4318
    resourceAttributes: service.namespace=shop,deployment.environment=test

    # Tempo's service-graph processor resolves a DB peer's node name in the
    # order peer.service -> server.address -> network.peer.address:port ->
    # db.namespace -> db.name. Our JDBC spans only carry
    # server.address=shop-db-rw.shop (the k8s Service DNS name), so without
    # this the DB node renders under that instead of a real database name.
    # peer.service is first in the resolution order, so setting it wins.
    # Use exactly "shop-db" (not the Service name) because that's the
    # instance name Database Observability itself registers
    # (infra/40-platform/k8s-monitoring.tf:200) — matching it lets both
    # products refer to the same database under one identity.
    peerServiceMapping: "shop-db-rw.shop:5432=shop-db"

    # The javaagent still emits pre-stable db attributes (db.statement,
    # db.sql.table). Alloy's set_semconv_span_name("1.37.0", ...) transform
    # names JDBC spans from the *stable* db.query.summary/db.collection.name
    # instead, so without this opt-in every span degrades to "SELECT shop"
    # rather than e.g. "SELECT order_items". The opt-in also adds
    # db.query.text (and friends), which is what would let a span link back
    # to its recorded query sample in Database Observability.
    #
    # "database/dup" rather than bare "database": bare *replaces* the
    # pre-stable attributes, which removes db.system — and the service
    # graph's connection_type=database classification is derived from
    # db.system. If Grafana Cloud's metrics-generator doesn't yet read the
    # stable db.system.name, the DB node would lose its database
    # classification entirely. "/dup" emits both old and new attributes, so
    # existing behavior can't regress — the safe way to roll this out.
    semconvStabilityOptIn: "database/dup"

  # Planted-fault toggles (issue spec, all default ON). Mirrors the
  # backend's own application.yml defaults explicitly here so the chart is a
  # complete, self-documenting control surface for demo purposes — a values
  # override doesn't require knowing the backend's internal property names.
  faults:
    slowSearch: true
    nPlusOne: true
    checkoutErrors: true
    memoryLeak: true
    memoryLeakMbPerMin: 2

  # Where the CNPG Cluster's initdb-generated app-user Secret lives (see
  # infra/40-platform/cloudnative-pg.tf: `kubernetes_manifest.shop_db`'s
  # `bootstrap.initdb.secret.name`, mirrored by its `cnpg_app_secret_name`
  # output). CNPG's generated Secret carries username/password/dbname/host/
  # port/uri/jdbc-uri keys; `jdbc-uri` is used directly for
  # SPRING_DATASOURCE_URL since Spring's relaxed binding expects a JDBC URL,
  # not the plain libpq `uri` key.
  database:
    secretName: shop-db-app

frontend:
  enabled: true

  image:
    # Same placeholder convention as backend.image.repository above.
    repository: ghcr.io/OWNER-PLACEHOLDER/grafana-cloud-test/frontend
    tag: latest
    # Same `latest`-tag rationale as backend.image.pullPolicy above.
    pullPolicy: Always

  service:
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

  # nginx serves the static bundle unconditionally once running — a cheap
  # TCP-level check on the listening port is enough for both probes here,
  # there's no app-level health endpoint to call.
  probes:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  # Faro collector URL/app key are per-environment runtime config, not
  # build-time constants — see apps/frontend/README.md's "Runtime
  # configuration" section. deploy-shop.sh sets faroCollectorUrl from
  # `tofu output -raw faro_collector_endpoint` (30-grafana-cloud); the
  # `grafana_frontend_o11y_app` resource exposes no separate app key
  # (research doc: the hosted collector's per-app URL is itself the
  # documented, complete credential), so faroAppKey stays empty — the
  # frontend's own initFaro() treats an empty key as "omit the header",
  # not "Faro disabled" (only an empty collector URL does that).
  faroCollectorUrl: ""
  faroAppKey: ""
  appEnvironment: test
  faultsEnabled: true

# The platform Gateway (infra/40-platform/envoy-gateway.tf) this chart's
# HTTPRoute attaches to via parentRefs — cross-namespace (Gateway lives in
# `gateway`, this chart's resources live in `shop`), which the Gateway's own
# `allowedRoutes.namespaces.from: All` permits.
gateway:
  namespace: gateway
  name: external

# Public hostname (infra/40-platform locals.shop_hostname / outputs.shop_hostname).
hostname: shop.rottlr.de

loadgen:
  enabled: true

  # Fully-qualified, verified to exist on Docker Hub (2026-08-06): the
  # official grafana/k6 image's `2.1.0` tag — see final report for the
  # verification evidence. Pinned to a specific version rather than
  # `:latest`/`:master` so a chart install is reproducible.
  image: docker.io/grafana/k6:2.1.0
  pullPolicy: IfNotPresent

  # In-cluster target: the backend Service this same chart renders, so no
  # separate DNS lookup/config is needed even before the frontend/HTTPRoute
  # are up. deploy-shop.sh leaves this at its default — only the standalone
  # `k6 cloud` invocation (load/README.md) points at the public hostname's
  # /api instead.
  baseUrl: ""

  # k6 run stdout is the only output sink (no `k6 cloud`/`--out` wired
  # in-cluster) — good enough for demo purposes; the CLI output can be read
  # via `kubectl logs` if anything looks wrong. Filled in by
  # scripts/deploy-shop.sh via `--set-file loadgen.script=load/k6/shop-load.js`.
  script: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

browserloop:
  enabled: true

  # The `-with-browser` variant ships a bundled Chromium alongside the k6
  # binary — verified to exist on Docker Hub alongside the plain image above
  # (same tag line, `-with-browser` suffix).
  image: docker.io/grafana/k6:2.1.0-with-browser
  pullPolicy: IfNotPresent

  # MUST stay the public hostname, not an in-cluster Service URL: the
  # `grafana_frontend_o11y_app` resource's `allowed_origins` only lists
  # `https://shop.rottlr.de` (infra/30-grafana-cloud/frontend-observability.tf),
  # and the hosted Faro Collector enforces CORS against that allowlist — a
  # cluster-internal origin would have every beacon silently rejected. See
  # also the comment at the top of load/browser/shop-browser.js.
  targetUrl: https://shop.rottlr.de

  script: ""

  # Chromium is meaningfully heavier than the plain HTTP load generator, so
  # this gets its own, larger budget rather than sharing loadgen's. The CPU
  # request matches the limit because a browser under constant load really
  # does sustain that usage — under-requesting it was a main contributor to
  # the first live run's single-node CPU starvation.
  resources:
    requests:
      cpu: 1000m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

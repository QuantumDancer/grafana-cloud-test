{{- if or .Values.backend.enabled .Values.frontend.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-shop
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    {{- if .Values.backend.enabled }}
    # /api → backend. Listed first: Gateway API rule ordering resolves ties by
    # "most specific path match wins" for prefix matches regardless of list
    # order, but keeping the more specific rule first matches how a reader
    # scans the file top-to-bottom too.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Release.Name }}-backend
          port: {{ .Values.backend.service.port }}
    {{- end }}
    {{- if .Values.frontend.enabled }}
    # Catch-all → frontend (the React app owns client-side routing for
    # everything that isn't /api).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-frontend
          port: {{ .Values.frontend.service.port }}
    {{- end }}
{{- end }}

{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
      # Both annotations belong here on the *pod* template, not on the Deployment's own
      # metadata: Alloy reads them off the Pod object, and one in the wrong metadata block
      # fails silently — the logs simply keep arriving twice.
      annotations:
        # "I ship my own logs over OTLP." The javaagent's logback appender already sends every
        # line to the applicationObservability receiver, so this tells the Platform not to tail
        # this container's stdout as well (ADR-0004; the matching drop rule is the
        # `podLogsViaLoki.extraDiscoveryRules` entry in infra/40-platform/k8s-monitoring.tf).
        telemetry.rottlr.de/logs: otlp
        # "This is who I am." Separate from the line above on purpose — see the ADR — and set
        # even though nothing scrapes this pod today: it is what the chart's `service_name`
        # chain consults first, ahead of the `app.kubernetes.io/name` label and the container
        # name, so if the drop rule above is ever lifted the stream arrives as spyglass-backend
        # rather than reviving the split identity as `backend`. OTEL_SERVICE_NAME below carries
        # the same value to the SDK; both read the one definition in values.yaml.
        resource.opentelemetry.io/service.name: {{ .Values.backend.otel.serviceName | quote }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # --- Database (CNPG-generated Secret, see values.yaml comment) ---
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.secretName }}
                  key: jdbc-uri
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.secretName }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.secretName }}
                  key: password

            # --- OpenTelemetry (Grafana OTel Java distribution javaagent baked into the image) ---
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.backend.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.backend.otel.serviceName | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.backend.otel.resourceAttributes | quote }}
            - name: OTEL_INSTRUMENTATION_COMMON_PEER_SERVICE_MAPPING
              value: {{ .Values.backend.otel.peerServiceMapping | quote }}
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: {{ .Values.backend.otel.semconvStabilityOptIn | quote }}

            # --- Planted faults (all default ON; see application.yml's relaxed binding) ---
            - name: FAULT_SLOW_SEARCH
              value: {{ .Values.backend.faults.slowSearch | quote }}
            - name: FAULT_N_PLUS_ONE
              value: {{ .Values.backend.faults.nPlusOne | quote }}
            - name: FAULT_CHECKOUT_ERRORS
              value: {{ .Values.backend.faults.checkoutErrors | quote }}
            - name: FAULT_MEMORY_LEAK
              value: {{ .Values.backend.faults.memoryLeak | quote }}
            - name: FAULT_MEMORY_LEAK_MB_PER_MIN
              value: {{ .Values.backend.faults.memoryLeakMbPerMin | quote }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          # The startup probe exists so the deliberately tight liveness probe
          # below never fires during boot: Spring Boot + the OTel javaagent
          # under this pod's small CPU limit take well over a minute to start
          # (first live deploy: liveness SIGTERM'd the pod at ~70s, repeatedly,
          # before the app ever came up). Liveness/readiness only begin once
          # this succeeds, so their own tuning stays honest about the
          # memory-leak fault's GC degradation.
          startupProbe:
            httpGet:
              path: {{ .Values.backend.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.backend.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.startupProbe.failureThreshold }}
          # See values.yaml's livenessProbe/readinessProbe comments for why both
          # target /api/health specifically (not Actuator's DB-checking one) and
          # why liveness is tuned tight enough to actually trip on the memory-leak
          # fault's GC degradation.
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
{{- end }}

# Config for nginxinc/nginx-unprivileged, which already runs as a non-root
# user on port 8080 and supplies its own nginx.conf that `include`s
# conf.d/*.conf — this file replaces the base image's default server block.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Never cache config.js — it's regenerated per-container-start from env
    # vars and must be re-fetched on every page load, unlike the hashed,
    # cache-forever JS/CSS bundles Vite emits.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: any path that isn't a real static file resolves to
    # index.html so React Router can handle client-side routes like
    # /products/3 on a hard refresh or deep link.
    location / {
        try_files $uri /index.html;
    }
}

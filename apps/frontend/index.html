<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spyglass — Observation Gear</title>
    <!-- Loaded before the app bundle so window.__SPYGLASS_CONFIG__ (Faro
         collector URL/app key, environment, faultsEnabled) is available the

         the static local-dev stand-in. See src/config.ts. -->
    <script src="/config.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
